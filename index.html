<!DOCTYPE html>
<html lang="mul">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BooksRead</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        .accent { color: #ff75fa; }
        .accent-bg { background-color: #ff75fa; }
    </style>
</head>
<body class="bg-zinc-50 text-zinc-950 min-h-screen pb-20">
    <div class="max-w-2xl mx-auto">
        <!-- 헤더 (초기화 버튼 완전 제거) -->
        <div class="sticky top-0 bg-white border-b border-zinc-200 z-50 shadow-sm">
            <div class="flex items-center justify-between px-6 py-5">
                <div class="flex items-center gap-3">
                    <span class="text-3xl accent">📖</span>
                    <h1 class="text-2xl font-bold tracking-tighter accent">독서 기록</h1>
                </div>
            </div>
        </div>

        <!-- 기록 목록 -->
        <div id="feed" class="pt-6 px-4 space-y-6"></div>
    </div>

    <!-- + 버튼 -->
    <button onclick="showModal()" 
            class="fixed bottom-8 right-8 w-16 h-16 accent-bg text-black rounded-full flex items-center justify-center text-4xl shadow-2xl hover:scale-110 active:scale-95">
        +
    </button>

    <!-- 입력 모달 -->
    <div id="modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
        <div class="bg-white rounded-3xl w-full max-w-md mx-4 overflow-hidden shadow-2xl">
            <div class="p-6 border-b border-zinc-200 flex items-center justify-between">
                <h2 id="modal-title" class="text-xl font-semibold">새 독서 기록</h2>
                <button onclick="hideModal()" class="text-3xl text-zinc-400">×</button>
            </div>
            <div class="p-6 space-y-6">
                <input id="title" type="text" 
                       class="w-full bg-zinc-100 border border-zinc-200 rounded-2xl px-6 py-4 text-lg placeholder-zinc-400 focus:border-[#ff75fa] outline-none"
                       placeholder="책 제목">

                <input id="publisher" type="text" 
                       class="w-full bg-zinc-100 border border-zinc-200 rounded-2xl px-6 py-4 text-lg placeholder-zinc-400 focus:border-[#ff75fa] outline-none"
                       placeholder="출판사">

                <textarea id="memo" rows="6" 
                          class="w-full bg-zinc-100 border border-zinc-200 rounded-3xl px-6 py-5 resize-none focus:border-[#ff75fa] outline-none"
                          placeholder="느낀점, 인상적인 문장, 독후감"></textarea>
            </div>
            <div class="p-6 border-t border-zinc-200 flex gap-4">
                <button onclick="hideModal()" class="flex-1 py-4 border border-zinc-300 rounded-3xl font-medium">취소</button>
                <button id="saveBtn" onclick="saveRecord()" class="flex-1 py-4 accent-bg text-black font-bold rounded-3xl">저장하기</button>
            </div>
        </div>
    </div>

    <script>
        let records = JSON.parse(localStorage.getItem('readingRecords')) || [];
        let editingIndex = null;

        function saveToStorage() {
            localStorage.setItem('readingRecords', JSON.stringify(records));
        }

        function renderFeed() {
            const feed = document.getElementById('feed');
            feed.innerHTML = '';
            
            if (records.length === 0) {
                feed.innerHTML = `
                    <div class="text-center py-20 text-zinc-400">
                        <div class="text-7xl mb-4 accent">📖</div>
                        <p>아직 기록이 없습니다<br>오른쪽 아래 + 버튼을 눌러 시작하세요</p>
                    </div>`;
                return;
            }

            records.slice().reverse().forEach((rec, idx) => {
                const realIndex = records.length - 1 - idx;
                const card = document.createElement('div');
                card.className = "bg-white rounded-3xl p-6 shadow-sm border border-zinc-100";
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="text-2xl font-bold">${rec.title}</div>
                            ${rec.publisher ? `<div class="text-zinc-500 mt-1">${rec.publisher}</div>` : ''}
                        </div>
                        <div class="flex gap-2">
                            <button onclick="editRecord(${realIndex}); event.stopImmediatePropagation()" class="w-9 h-9 flex items-center justify-center text-xl hover:bg-zinc-100 rounded-2xl">✏️</button>
                            <button onclick="deleteRecord(${realIndex}); event.stopImmediatePropagation()" class="w-9 h-9 flex items-center justify-center text-xl hover:bg-red-100 text-red-500 rounded-2xl">✕</button>
                        </div>
                    </div>
                    <div class="mt-6 text-zinc-700 leading-relaxed whitespace-pre-wrap">${rec.memo}</div>
                    <div class="text-xs text-zinc-400 mt-6">${new Date(rec.date).toLocaleDateString('ko-KR', {year:'numeric', month:'long', day:'numeric'})}</div>
                `;
                feed.appendChild(card);
            });
        }

        function showModal(editIdx = null) {
            editingIndex = editIdx;
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('title').value = '';
            document.getElementById('publisher').value = '';
            document.getElementById('memo').value = '';

            if (editIdx !== null) {
                const r = records[editIdx];
                document.getElementById('modal-title').textContent = '기록 수정';
                document.getElementById('saveBtn').textContent = '수정 완료';
                document.getElementById('title').value = r.title;
                document.getElementById('publisher').value = r.publisher || '';
                document.getElementById('memo').value = r.memo;
            } else {
                document.getElementById('modal-title').textContent = '새 독서 기록';
                document.getElementById('saveBtn').textContent = '저장하기';
            }
        }

        function hideModal() {
            document.getElementById('modal').classList.add('hidden');
            editingIndex = null;
        }

        function saveRecord() {
            const title = document.getElementById('title').value.trim();
            const publisher = document.getElementById('publisher').value.trim();
            const memo = document.getElementById('memo').value.trim();

            if (!title) { alert("책 제목을 입력하세요"); return; }
            if (!memo) { alert("느낀점을 입력하세요"); return; }

            if (editingIndex !== null) {
                records[editingIndex].title = title;
                records[editingIndex].publisher = publisher;
                records[editingIndex].memo = memo;
            } else {
                records.push({
                    title,
                    publisher,
                    memo,
                    date: new Date().toISOString()
                });
            }

            saveToStorage();
            hideModal();
            renderFeed();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function editRecord(idx) {
            showModal(idx);
        }

        function deleteRecord(idx) {
            if (confirm("이 기록을 삭제할까요?")) {
                records.splice(idx, 1);
                saveToStorage();
                renderFeed();
            }
        }

        window.onload = () => {
            renderFeed();
        };
    </script>
</body>
</html>
